name: 抓取美股公告

on:
  schedule:
    # GitHub 的 cron 用 UTC。北京时间 00:05 / 06:05 / 12:05 / 18:05 = UTC 16:05 / 22:05 / 04:05 / 10:05
    # 注意：GitHub 的定时任务不保证准点，高峰期可能延迟 5~30 分钟，对本站无所谓。
    - cron: "5 4,10,16,22 * * *"
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下跑
  # 改了代码就自动跑一次，省得手动点，也能立刻验证改动生效。
  # 必须限定 paths：机器人自己提交的是 data/ 和 docs/，
  # 不限定的话会变成「机器人提交 → 触发 → 又提交」的死循环。
  push:
    branches: [main]
    paths:
      - "main.py"
      - "brief.py"
      - "db.py"
      - "fetch_sec.py"
      - "translate.py"
      - "macro.py"
      - "requirements.txt"
      - ".github/workflows/daily.yml"

permissions:
  contents: write           # 需要写权限才能把去重库和新简报提交回来

concurrency:
  group: usstockintel
  cancel-in-progress: false # 上一轮没跑完就别开新的，避免并发写库

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 版本要跟 Node 运行时对齐：v7 用 node24，v4/v5 还是 node20（已被 GitHub 标记弃用）
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取 + AI 概括
        env:
          # 在仓库 Settings → Secrets and variables → Actions 里添加
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          # 可选：不配就用 config.yaml 里那个（公开仓库建议配一个，免得邮箱被爬）
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # 发布模式：去掉本机管理面板——线上访问不到你本机的 127.0.0.1:8765
          PUBLISH_MODE: "1"
          # 云端「增删监控公司」后台（Cloudflare Worker）。留空就不渲染那个面板
          ADMIN_API: "https://sec-admin.pan1305674071.workers.dev"
          # 抓取时从后台拉名单（网页上增删的公司存在 Worker 的 KV 里）。
          # 拉不到会自动回退 config.yaml，后台挂了也不会让这次抓取失败。
          WATCHLIST_API: "https://sec-admin.pan1305674071.workers.dev"
        run: python main.py

      - name: 发布到 docs/
        run: |
          set -e
          mkdir -p docs
          today=$(date +%F)
          cp "out/简报-${today}.html" docs/index.html
          cp "out/简报-${today}.html" "docs/简报-${today}.html"
          if [ -f "out/简报-${today}.md" ]; then
            cp "out/简报-${today}.md" "docs/简报-${today}.md"
          fi
          # 只留最近 14 天的归档，避免 docs/ 无限膨胀。
          # 注意不能用 find -mtime：checkout 出来的文件 mtime 全是当天，删不掉任何东西，
          # 必须按文件名里的日期判断。
          python - <<'PYEOF'
          import glob, os, re
          from datetime import date, timedelta
          cut = (date.today() - timedelta(days=14)).isoformat()
          for p in glob.glob("docs/简报-*"):
              m = re.search(r"(\d{4}-\d{2}-\d{2})", os.path.basename(p))
              if m and m.group(1) < cut:
                  os.remove(p)
                  print("清理旧归档:", p)
          PYEOF

      - name: 提交回去（去重库 + 网页）
        run: |
          set -e

          # 心跳文件：公开仓库里「60 天没有提交」会被 GitHub 自动禁用定时任务，
          # 而且是静默的（不报错，只是不再跑）。如果哪段时间公司都没发公告就
          # 不会产生提交，所以这里每 7 天至少留一次活动记录。
          python - <<'PYEOF'
          import datetime, os
          f = "data/.last-run"
          today = datetime.date.today()
          cut = (today - datetime.timedelta(days=7)).isoformat()
          try:
              with open(f, encoding="utf-8") as fh:
                  last = fh.read().strip()
          except OSError:
              last = ""
          if not last or last < cut:
              os.makedirs("data", exist_ok=True)
              with open(f, "w", encoding="utf-8") as fh:
                  fh.write(today.isoformat() + "\n")
              print("已更新心跳文件 data/.last-run →", today.isoformat())
          else:
              print("心跳文件还新（上次", last, "），不用动")
          PYEOF

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "本次没有新内容，跳过提交"
          else
            git commit -m "自动更新 $(date +%F)"
            git push
          fi
